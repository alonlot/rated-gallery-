<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rated Gallery</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1b1b1f; --muted: #666; --card: #f1f2f6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121317; --fg: #e8e8ee; --muted: #9a9aa6; --card: #1e2027; } }
  body { margin: 0; padding: 16px; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border-radius: 12px; padding: 12px; margin: 12px 0; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 0; background: #3d7bff; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 4px; }
  .grid div { position: relative; aspect-ratio: 1; background: var(--card); overflow: hidden; border-radius: 4px; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid span { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Rated Gallery</h1>
<div class="muted">Fallback page: the full gallery (assets/web/gallery.html) was not in this build.</div>
<div class="card">
  <div id="status">Status: …</div>
  <div id="count">Photos in index: …</div>
  <p><button id="sync">Sync now</button> <button id="pc">Open PC</button></p>
</div>
<div class="grid" id="grid"></div>
<script>
  function bridge() { return window.RGBridge; }
  function renderStatus(s) {
    var t = s.paired ? ("Paired with " + s.host + ":" + s.port + (s.connected ? " (reachable)" : " (not reachable)")) : "Not paired";
    if (s.syncing) t += " · syncing: " + s.phase + (s.total ? " " + s.done + "/" + s.total : "");
    if (s.message) t += " · " + s.message;
    if (s.lastSync) t += " · last sync " + new Date(s.lastSync * 1000).toLocaleString();
    document.getElementById("status").textContent = "Status: " + t;
  }
  function renderIndex() {
    var idx = { photos: [] };
    try { idx = JSON.parse(bridge().getIndex()); } catch (e) {}
    var photos = idx.photos || [];
    document.getElementById("count").textContent = "Photos in index: " + photos.length;
    photos.sort(function (a, b) { return (b.s == null ? -1 : b.s) - (a.s == null ? -1 : a.s); });
    var grid = document.getElementById("grid");
    grid.textContent = "";
    photos.slice(0, 60).forEach(function (p) {
      if (!p.mid) return;
      var d = document.createElement("div");
      var img = document.createElement("img");
      img.loading = "lazy";
      img.src = "/media/thumb/" + encodeURIComponent(p.mid);
      img.onclick = function () { window.open("/media/full/" + encodeURIComponent(p.mid), "_self"); };
      d.appendChild(img);
      if (p.s != null) { var sp = document.createElement("span"); sp.textContent = p.s.toFixed(1); d.appendChild(sp); }
      grid.appendChild(d);
    });
  }
  window.RG_onStatus = renderStatus;
  window.RG_onIndexUpdated = renderIndex;
  document.getElementById("sync").onclick = function () { bridge() && bridge().syncNow(); };
  document.getElementById("pc").onclick = function () { bridge() && bridge().openPC(); };
  if (bridge()) {
    try { renderStatus(JSON.parse(bridge().getStatus())); } catch (e) {}
    renderIndex();
  } else {
    document.getElementById("status").textContent = "Status: RGBridge not available";
  }
</script>
</body>
</html>
