<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Rated Gallery login</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main style="max-width: 360px; margin: 15vh auto; padding: 16px;">
  <h1>Rated Gallery</h1>
  <form id="f" class="card">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" style="width: 100%; margin: 6px 0 12px;" autofocus>
    <button class="primary" style="width: 100%;">Log in</button>
    <div id="msg" class="err small" style="margin-top: 8px;"></div>
  </form>
</main>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) location.href = '/';
  else document.getElementById('msg').textContent = (await r.json()).detail || 'Login failed';
});
</script>
</body>
</html>
